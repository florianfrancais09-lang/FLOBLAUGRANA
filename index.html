<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLOBLAUGRANA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#004D98; --garnet:#A50044; --gold:#EDBB00;
  --bg:#F2F5FB; --surface:#FFFFFF; --text:#0E1F3D; --muted:#5B6882; --line:#D9E0EE;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A1630;--surface:#12244A;--text:#EEF2FB;--muted:#A5B2CE;--line:#233866}
}
:root[data-theme="dark"]{--bg:#0A1630;--surface:#12244A;--text:#EEF2FB;--muted:#A5B2CE;--line:#233866}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
a,button{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* HERO */
.hero{position:relative;min-height:88svh;display:flex;align-items:flex-end;overflow:hidden;color:#fff;background:var(--blue)}
.stripes{position:absolute;inset:0;display:flex}
.stripes i{flex:1;transform-origin:bottom;transform:scaleY(0);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.stripes i:nth-child(odd){background:var(--blue)}
.stripes i:nth-child(even){background:var(--garnet)}
.stripes i:nth-child(1){animation-delay:.05s}.stripes i:nth-child(2){animation-delay:.12s}
.stripes i:nth-child(3){animation-delay:.19s}.stripes i:nth-child(4){animation-delay:.26s}
.stripes i:nth-child(5){animation-delay:.33s}.stripes i:nth-child(6){animation-delay:.40s}
.stripes i:nth-child(7){animation-delay:.47s}.stripes i:nth-child(8){animation-delay:.54s}
.stripes i:nth-child(9){animation-delay:.61s}
@keyframes rise{to{transform:scaleY(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,15,40,.85) 5%,rgba(5,15,40,0) 65%)}
.hero-ball{position:absolute;right:-8%;top:8%;width:min(70vw,520px);opacity:.18;z-index:1;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-inner{position:relative;z-index:2;padding:0 20px 44px;max-width:1080px;margin:0 auto;width:100%}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,15.5vw,9.5rem);line-height:.88;margin:0 0 16px;letter-spacing:-.01em;text-transform:none;
  opacity:0;animation:show .8s .95s ease forwards}
.hero p{max-width:34ch;font-size:1.1rem;margin:0 0 22px;opacity:0;animation:show .8s 1.15s ease forwards}
.hero .btn{opacity:0;animation:show .8s 1.3s ease forwards}
@keyframes show{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{display:inline-block;background:var(--gold);color:#1a1400;border:0;border-radius:999px;padding:13px 24px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}

/* FOND ANIMÉ */
.hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;transform:scale(1.05);transition:opacity 1.8s ease}
.bg-img.on,.bg-img.out{animation:kb 9s linear forwards}
.bg-img.on{opacity:.55}
@keyframes kb{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.2) translate(-2.5%,-1.5%)}}

/* BARRE */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center;overflow-x:auto;scrollbar-width:none}
.bar-in::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 16px;font-weight:500;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* NEWS */
main{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.note{background:var(--surface);border-left:5px solid var(--gold);padding:12px 16px;border-radius:6px;color:var(--muted);font-size:.92rem;margin-bottom:26px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--line);padding:0;color:inherit;display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(0,40,100,.2)}
.card.first{grid-column:1/-1}
@keyframes enter{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.pic{overflow:hidden;aspect-ratio:8/5}
.card.first .pic{aspect-ratio:16/7}
.pic img{object-position:50% 30%}
.pic svg,.pic img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .pic svg,.card:hover .pic img{transform:scale(1.08)}
.txt{padding:16px 18px 20px}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;background:var(--garnet);border-radius:5px;padding:2px 9px;margin-bottom:8px}
.card h2{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;margin:0 0 8px}
.card.first h2{font-size:clamp(2rem,6vw,3.2rem)}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.date{display:block;margin-top:10px;font-size:.82rem;color:var(--muted)}

/* PAGE ARTICLE */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.page.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s}
.back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:60;border:0;border-radius:999px;background:rgba(5,15,40,.75);color:#fff;padding:10px 18px;font-weight:700;cursor:pointer;
  transform:translateX(-140%);transition:transform .5s .25s cubic-bezier(.2,.8,.2,1)}
.page.open .back{transform:none}
.page-hero{aspect-ratio:16/9;max-height:52svh;width:100%}
.page-hero svg,.page-hero img{width:100%;height:100%;object-fit:cover}
.page.open .page-hero svg,.page.open .page-hero img{animation:settle 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes settle{from{transform:scale(1.15)}to{transform:none}}
.page-body{max-width:720px;margin:0 auto;padding:22px 20px}
.page-body h1{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,11vw,4.6rem);line-height:.92;margin:6px 0 8px}
.page-body .date{margin:0 0 20px}
.page-body p{max-width:62ch;margin:0 0 14px;font-size:1.05rem}
.more-t{font-family:var(--display);font-size:1.8rem;margin:34px 0 12px}
.more{display:grid;gap:12px}
.more-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:inherit;text-decoration:none;transition:transform .25s,border-color .25s}
.more-card:hover{transform:translateX(6px);border-color:var(--blue)}
.more-card b{display:block;font-family:var(--display);font-size:1.4rem;line-height:1.05}
.swap{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}

footer{padding:30px 20px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .stripes i{transform:none}.bg-img.on,.bg-img.out{animation:none}.hero h1,.hero p,.hero .btn{opacity:1}
}
</style>
</head>

  <div class="hero-inner">

    s=`<rect width="400" height="250" fill="${N}"/>`;
    for(let i=0;i<10;i++)s+=`<rect x="${i*40}" width="40" height="250" fill="${i%2?G:B}" opacity=".35"/>`;
    s+=`<path d="M200 12C232 66 296 88 286 158C281 204 244 238 200 238C156 238 119 204 114 158C110 118 138 102 150 66C168 92 186 98 200 12Z" fill="${G}"/><path d="M200 70C220 104 256 120 250 164C247 196 226 222 200 222C174 222 153 196 150 164C147 138 166 128 174 106C186 120 194 120 200 70Z" fill="${Y}"/><text x="200" y="196" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="104" fill="#fff" stroke="${N}" stroke-width="3" paint-order="stroke">19</text>`;
  }else if(kind==="cross"){
    s=`<rect width="400" height="250" fill="${B}"/><circle cx="60" cy="40" r="110" fill="${G}" opacity=".8"/><circle cx="360" cy="230" r="90" fill="${N}" opacity=".5"/><rect x="165" y="55" width="70" height="140" rx="14" fill="#fff"/><rect x="130" y="90" width="140" height="70" rx="14" fill="#fff"/><rect x="185" y="75" width="30" height="100" rx="6" fill="${G}"/><rect x="150" y="110" width="100" height="30" rx="6" fill="${G}"/>`;
  }else{
    s=`<rect width="400" height="250" fill="${B}"/><circle cx="330" cy="40" r="120" fill="${G}"/><circle cx="60" cy="230" r="90" fill="${N}" opacity=".5"/>`;
    s+=`<g transform="translate(200 125)"><circle r="70" fill="#fff"/><polygon points="0,-28 27,-9 17,24 -17,24 -27,-9" fill="${N}"/><path d="M0 -28V-68M27 -9l40-12M17 24l25 34M-17 24l-25 34M-27 -9l-40-12" stroke="${N}" stroke-width="4" fill="none"/></g>`;
  }
  return `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration">${s}</svg>`;
}

/* ===== AFFICHAGE ===== */
const grid=document.getElementById("grid"),filters=document.getElementById("filters");
let current="Tout";
const cats=["Tout",...new Set(NEWS.map(n=>n.cat))];

function renderFilters(){
  filters.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===current);
    b.onclick=()=>{current=c;renderFilters();renderGrid()};
    filters.appendChild(b);
  });
}
function renderGrid(){
  grid.innerHTML="";
  const list=NEWS.map((n,i)=>({...n,i})).filter(n=>current==="Tout"||n.cat===current);
  list.forEach((n,k)=>{
    const c=document.createElement("button");
    c.className="card"+(k===0?" first":"");
    c.style.animationDelay=(k*70)+"ms";
    c.innerHTML=`<div class="pic">${pic(n)}</div><div class="txt"><span class="tag">${n.cat}</span><h2>${n.title}</h2><p>${n.short}</p><span class="date">${n.date}</span></div>`;
    c.onclick=()=>openArticle(n.i);
    c.setAttribute("aria-label","Ouvrir l'article : "+n.title);
    grid.appendChild(c);
  });
}

/* ===== PAGE ARTICLE ===== */
const page=document.getElementById("page"),pageIn=document.getElementById("page-in"),back=document.getElementById("back");
let lastFocus=null;
function pic(n){return n.photo?`<img src="${n.photo}" alt="${n.alt||n.title}">`:art(n.art)}
function showPage(i){
  const n=NEWS[i];
  const more=NEWS.map((x,k)=>({...x,k})).filter(x=>x.k!==i).slice(0,3);
  pageIn.innerHTML=`<div class="page-hero pic">${pic(n)}</div><div class="page-body"><span class="tag">${n.cat}</span><h1>${n.title}</h1><p class="date">${n.date}</p>${n.text.map(t=>`<p>${t}</p>`).join("")}<h3 class="more-t">À lire aussi</h3><div class="more">${more.map(x=>`<a class="more-card" href="#article-${x.k}"><span class="tag">${x.cat}</span><b>${x.title}</b></a>`).join("")}</div></div>`;
  pageIn.classList.remove("swap");void pageIn.offsetWidth;pageIn.classList.add("swap");
  page.scrollTop=0;
  page.classList.add("open");page.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  back.focus({preventScroll:true});
}
function closePage(){
  page.classList.remove("open");page.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  if(lastFocus){lastFocus.focus({preventScroll:true});lastFocus=null}
}
function route(){
  const m=location.hash.match(/^#article-(\d+)$/);
  if(m&&NEWS[+m[1]])showPage(+m[1]);else closePage();
}
function openArticle(i){
  lastFocus=document.activeElement;
  try{location.hash="article-"+i}catch(e){}
  if(location.hash!=="#article-"+i)showPage(i);
}
back.onclick=()=>{
  try{location.hash=""}catch(e){}
  closePage();
};
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&page.classList.contains("open"))back.click()});

/* ===== FOND ANIMÉ : diaporama de photos derrière le titre ===== */
(function(){
  const box=document.getElementById("hero-bg");
  const keys=["yamal","europe","getafe","attaque","clasico","classement","camp","calendrier"];
  keys.forEach(k=>{const im=document.createElement("img");im.className="bg-img";im.alt="";im.src=IMG[k];box.appendChild(im)});
  const imgs=box.querySelectorAll(".bg-img");
  let i=0,cur=null;
  function next(){
    imgs.forEach(x=>{if(x!==cur)x.classList.remove("out")});
    if(cur){cur.classList.remove("on");cur.classList.add("out")}
    cur=imgs[i];cur.classList.remove("out");cur.classList.add("on");
    i=(i+1)%imgs.length;
  }
  const still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{next();if(!still)setInterval(next,6000)},1100);
})();

renderFilters();renderGrid();route();
</script>
